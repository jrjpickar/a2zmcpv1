# Slack app manifest for the JARVIS bot user. api.slack.com/apps > Create New App > From a manifest.
# Generate an app-level token with connections:write, then set SLACK_APP_TOKEN on the VM.
display_information:
  name: JARVIS
  description: A2Z Operations assistant. Ask about KPIs, mail, plans, or get a second opinion from Gemini.
  background_color: "#1c1309"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: JARVIS
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - reaction_added
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
