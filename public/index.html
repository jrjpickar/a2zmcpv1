<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101311">
  <title>A2Z Operations</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="shell masthead">
    <div class="mark" aria-label="A2Z">A<span>2</span>Z</div>
    <div class="identity"><strong>Operations</strong><span>A2Z Construction Services</span></div>
    <form id="controls">
      <label for="range" class="sr-only">Reporting period</label>
      <select id="range"><option value="today">Today</option><option value="wtd">This week</option><option value="mtd" selected>This month</option><option value="30d">Last 30 days</option><option value="ytd">This year</option></select>
      <button id="refresh" type="submit">Refresh</button>
    </form>
  </header>
  <main class="shell">
    <div class="heading"><h1>Command center</h1><p id="status" role="status">Connecting…</p></div>
    <section id="auth" class="surface access" hidden>
      <form id="signin"><label for="key">Dashboard access key</label><input id="key" type="password" autocomplete="current-password" required><button type="submit">Unlock</button></form>
    </section>
    <div id="dashboard" hidden>
      <div id="tiles" aria-label="Key metrics"></div>
      <div class="workspace">
        <section class="surface scene" aria-labelledby="scene-title">
          <div class="scene-heading"><h2 id="scene-title">Operations map</h2><button type="button" id="reset">Reset view</button></div>
          <div id="map">
            <canvas id="city" aria-hidden="true"></canvas>
            <div id="stations" aria-label="Select a metric on the operations map"></div>
          </div>
        </section>
        <aside class="surface detail" aria-labelledby="detail-title">
          <h2 id="detail-title">System health</h2>
          <div id="detail-content"></div>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
